name: Build MultiEFI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  prepare-gnu-efi:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: gnu-efi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gnu-efi headers/libs
        run: |
          sudo apt update
          sudo apt install -y gnu-efi

      - name: Package gnu-efi for Windows
        run: |
          # Create a temporary staging area to prevent double-nesting on extraction
          mkdir -p staging/gnu-efi/include
          mkdir -p staging/gnu-efi/lib/x86_64
          mkdir -p staging/gnu-efi/lib/i386
          
          # Copy headers
          cp -r /usr/include/efi staging/gnu-efi/include
          
          # Copy 64-bit library files
          cp /usr/lib/libefi.a staging/gnu-efi/lib/x86_64/
          cp /usr/lib/libgnuefi.a staging/gnu-efi/lib/x86_64/
          cp /usr/lib/crt0-efi-x86_64.o staging/gnu-efi/lib/x86_64/
          cp /usr/lib/elf_x86_64_efi.lds staging/gnu-efi/lib/x86_64/

          # Copy 32-bit library files
          cp /usr/lib32/libefi.a staging/gnu-efi/lib/i386/
          cp /usr/lib32/libgnuefi.a staging/gnu-efi/lib/i386/
          cp /usr/lib32/crt0-efi-ia32.o staging/gnu-efi/lib/i386/
          cp /usr/lib32/elf_ia32_efi.lds staging/gnu-efi/lib/i386/

          # Tar from inside the staging folder to keep your precise structure
          cd staging
          tar czf ../gnu-efi.tar.gz gnu-efi

      - name: Upload gnu-efi artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnu-efi
          path: gnu-efi.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: prepare-gnu-efi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download gnu-efi artifact
        uses: actions/download-artifact@v4
        with:
          name: gnu-efi
          path: gnu-efi-download

      - name: Extract gnu-efi
        run: |
          mkdir gnu-efi
          tar -xzf gnu-efi-download\gnu-efi.tar.gz -C gnu-efi

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Build x86_64 EFI (PE/COFF)
        shell: msys2 {0}
        run: |
          mkdir -p build/x64
          gcc -I gnu-efi/gnu-efi/include/efi \
              -I gnu-efi/gnu-efi/include/efi/x86_64 \
              -c src/MultiEFI.c \
              -o build/x64/MultiEFI.o \
              -DEFI_FUNCTION_WRAPPER \
              -ffreestanding \
              -fshort-wchar \
              -fno-stack-protector \
              -mno-red-zone \
              -Wall

          gcc -nostdlib -Wl,-e,efi_main \
              -Wl,--subsystem,10 \
              -o build/x64/bootx64.efi \
              build/x64/MultiEFI.o \
              -L gnu-efi/gnu-efi/lib/x86_64 \
              -lgnuefi -lefi -lgcc

      - name: Build i386 EFI (PE/COFF)
        shell: msys2 {0}
        run: |
          mkdir -p build/i386
          gcc -m32 -I gnu-efi/gnu-efi/include/efi \
              -I gnu-efi/gnu-efi/include/efi/ia32 \
              -c src/MultiEFI.c \
              -o build/i386/MultiEFI.o \
              -DEFI_FUNCTION_WRAPPER \
              -ffreestanding \
              -fshort-wchar \
              -fno-stack-protector \
              -Wall

          gcc -m32 -nostdlib -Wl,-e,efi_main \
              -Wl,--subsystem,10 \
              -o build/i386/bootia32.efi \
              build/i386/MultiEFI.o \
              -L gnu-efi/gnu-efi/lib/i386 \
              -lgnuefi -lefi -lgcc

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiEFI-Binaries
          path: build/
