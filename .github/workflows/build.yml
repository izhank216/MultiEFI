name: Build MultiEFI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils git make

      - name: Clone and Compile GNU-EFI Natively
        shell: msys2 {0}
        run: |
          git clone https://git.code.sf.net/p/gnu-efi/code gnu-efi-src
          cd gnu-efi-src
          # Compile gnu-efi explicitly using the MinGW cross-compiler tools
          make ARCH=x86_64 HOSTCC=gcc CC=gcc AS=as LD=ld OBJCOPY=objcopy

      - name: Build x86_64 EFI (PE/COFF)
        shell: msys2 {0}
        run: |
          mkdir -p build/x64
          
          # Compile your source using headers compiled natively
          gcc -I gnu-efi-src/inc \
              -I gnu-efi-src/inc/x86_64 \
              -I gnu-efi-src/inc/protocol \
              -c src/MultiEFI.c \
              -o build/x64/MultiEFI.o \
              -DEFI_FUNCTION_WRAPPER \
              -ffreestanding \
              -fshort-wchar \
              -fno-stack-protector \
              -mno-red-zone \
              -Wall

          # Link with the freshly generated native PE/COFF libraries
          gcc -nostdlib -Wl,-e,efi_main \
              -Wl,--subsystem,10 \
              -o build/x64/bootx64.efi \
              gnu-efi-src/gnuefi/crt0-efi-x86_64.o \
              build/x64/MultiEFI.o \
              -L gnu-efi-src/gnuefi \
              -L gnu-efi-src/lib \
              -lgnuefi -lefi -lgcc

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiEFI-Binaries
          path: build/
